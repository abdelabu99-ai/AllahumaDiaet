<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    HALABI App-Icon. Quelle für scripts/generate-icons.mjs.
    - #background: Hintergrundfarbe (colors.primary). Keine abgerundeten Ecken, die Maske setzt das Betriebssystem.
    - #motif: Scan-Motiv in einem 100×100-Raster, angelehnt an den `scan`-Pfad in src/components/Icon.tsx.
      Das Skript liest den Inhalt dieser Gruppe und platziert ihn für jede Variante neu.
      Innerhalb von #motif keine weiteren <g>-Elemente verwenden.
  -->
  <rect id="background" width="1024" height="1024" fill="#16A34A"/>
  <g id="motif" transform="translate(224 224) scale(5.76)" fill="#FFFFFF" stroke="#FFFFFF">
    <path d="M8 28V16a8 8 0 0 1 8-8h12" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M72 8h12a8 8 0 0 1 8 8v12" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M92 72v12a8 8 0 0 1-8 8H72" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M28 92H16a8 8 0 0 1-8-8V72" fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="32" width="6" height="36" rx="1.5" stroke="none"/>
    <rect x="36" y="32" width="3" height="36" rx="1.5" stroke="none"/>
    <rect x="43" y="32" width="8" height="36" rx="1.5" stroke="none"/>
    <rect x="55" y="32" width="3" height="36" rx="1.5" stroke="none"/>
    <rect x="62" y="32" width="4" height="36" rx="1.5" stroke="none"/>
    <rect x="70" y="32" width="4" height="36" rx="1.5" stroke="none"/>
  </g>
</svg>
